<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conciliación de Inventario</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b10;color:#e7edf2;font-family:Inter,Segoe UI,Arial,sans-serif}
.card{background:linear-gradient(180deg,#111a22,#0c1218);border:1px solid #263442;border-radius:18px;box-shadow:0 15px 40px #0008}
.btn{border:1px solid #304151;background:#121c25;border-radius:10px;padding:9px 14px;color:#e8eef3;cursor:pointer}
.btn:hover{background:#1a2a36}.primary{background:#0879a8;border-color:#0879a8}.primary:hover{background:#09668e}
.input,.select{width:100%;background:#091118;border:1px solid #2b3b49;color:#fff;border-radius:10px;padding:10px 12px;outline:none}
.input:focus,.select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px #38bdf81a}
.flow-card{background:#176681;border:2px solid #082f42;border-radius:18px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 25px #0006}
.flow-label{font-size:12px;font-weight:800;color:#eaf8fd;margin-bottom:8px}.flow-value{font-size:29px;font-weight:900}
.metric{background:#101a22;border:1px solid #273744;border-radius:14px;padding:14px}
.metric .v{font-size:24px;font-weight:900;margin-top:5px}.small{font-size:10px;color:#8193a1;text-transform:uppercase;letter-spacing:.5px}
.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#091118;color:#8ea2b0;font-size:10px;text-transform:uppercase;z-index:2}td,th{padding:9px 10px;border-bottom:1px solid #202d38;white-space:nowrap}tbody tr:hover{background:#14202a}
.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800}.green{background:#00b85a22;color:#47e58d}.red{background:#e0000022;color:#ff6b6b}.cyan{background:#38bdf822;color:#71d9ff}.yellow{background:#f59e0b22;color:#ffd27a}
.drop{border:1px dashed #344757;transition:.2s}.drop.drag{border-color:#38bdf8;background:#38bdf80a}
.waterfall{height:380px}
@media(max-width:800px){.flow-value{font-size:22px}.waterfall{height:300px}}

/* ===== CUADROS DE MOVIMIENTOS · DISEÑO PREMIUM ===== */
.movement-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  margin-bottom:20px;
  align-items:stretch;
}
.movement-card{
  min-width:0;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg,#121d26,#0b1218);
  border:1px solid #263746;
  box-shadow:0 14px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.025);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.movement-card:hover{
  transform:translateY(-2px);
  border-color:#315064;
  box-shadow:0 18px 38px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.03);
}
.movement-card h2{
  font-size:15px;
  line-height:1.25;
  letter-spacing:-.15px;
}
.movement-card .movement-sub{
  font-size:11px;
  color:#718594;
  margin-top:5px;
  line-height:1.35;
}
.movement-card .movement-total{
  text-align:right;
  flex:0 0 auto;
}
.movement-card .movement-total .small{
  font-size:9px;
}
.movement-card .movement-total-value{
  font-size:21px;
  line-height:1.05;
  margin-top:4px;
  font-weight:900;
  white-space:nowrap;
}
.movement-table-wrap{
  margin-top:14px;
  border:1px solid #1e2d38;
  border-radius:12px;
  overflow:auto;
  background:#081016;
}
.movement-table-wrap table{
  min-width:560px;
}
.movement-table-wrap th{
  padding:10px 12px;
  font-size:9px;
  letter-spacing:.55px;
  background:#071017;
}
.movement-table-wrap td{
  padding:10px 12px;
  font-size:12px;
}
.movement-table-wrap tbody tr:nth-child(even){
  background:rgba(255,255,255,.012);
}
.movement-table-wrap tbody tr:hover{
  background:#14232d;
}
@media(min-width:1450px){
  .movement-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:1200px){
  .movement-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:700px){
  .movement-grid{grid-template-columns:1fr;gap:14px;}
  .movement-card{padding:14px;}
}


/* ===== ALTURA UNIFORME Y SCROLL INTERNO ===== */
.movement-grid{
  align-items:stretch;
}
.movement-card{
  height:430px;
  min-height:430px;
  max-height:430px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.movement-card > .movement-table-wrap{
  flex:1 1 auto;
  min-height:0;
  max-height:315px;
  overflow:auto;
}
.movement-table-wrap table{
  width:100%;
  min-width:560px;
}
.movement-table-wrap thead th{
  position:sticky;
  top:0;
  z-index:2;
}
@media(max-width:700px){
  .movement-card{
    height:430px;
    min-height:430px;
    max-height:430px;
  }
}


/* ===== BARRA DE FILTROS FIJA Y COMPACTA ===== */
.filter-bar{
  position:sticky;
  top:78px;
  z-index:40;
  padding:8px 12px !important;
  border-radius:14px !important;
  margin-bottom:14px !important;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
.filter-bar .filter-layout{
  display:grid;
  grid-template-columns:150px minmax(150px,1.1fr) minmax(150px,1fr) minmax(150px,1fr) minmax(140px,1fr) minmax(140px,1fr) minmax(140px,1fr) auto auto minmax(220px,1.6fr);
  align-items:center;
  gap:8px;
}
.filter-bar .source-box{
  min-width:0;
}
.filter-bar .source-box .small{
  font-size:8px;
}
.filter-bar .source-box #sourceName{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.filter-bar .source-box .text-xs{
  font-size:9px;
}
.filter-bar .input,
.filter-bar .select{
  min-height:38px;
  height:38px;
  padding:8px 10px;
  font-size:12px;
}
.filter-bar .filter-buttons{
  display:flex;
  gap:6px;
}
.filter-bar .filter-buttons .btn{
  height:38px;
  padding:7px 11px;
  font-size:12px;
  white-space:nowrap;
}
.filter-bar .filter-help{
  font-size:9px;
  line-height:1.25;
  color:#718594;
}
@media(max-width:1450px){
  .filter-bar .filter-layout{
    grid-template-columns:130px minmax(140px,1fr) minmax(140px,1fr) minmax(140px,1fr) minmax(130px,1fr) minmax(130px,1fr) minmax(130px,1fr) auto auto;
  }
  .filter-bar .filter-help{
    display:none;
  }
}
@media(max-width:1000px){
  .filter-bar{
    top:70px;
  }
  .filter-bar .filter-layout{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .filter-bar .source-box{
    grid-column:span 2;
  }
  .filter-bar .filter-help{
    display:block;
    grid-column:span 4;
  }
}
@media(max-width:650px){
  .filter-bar .filter-layout{
    grid-template-columns:1fr 1fr;
  }
  .filter-bar .source-box,
  .filter-bar .filter-help{
    grid-column:span 2;
  }
}


/* ===== RESUMEN KPI · COMPACTO PREMIUM ===== */
.kpi-compact{
  padding:11px 14px !important;
  margin-bottom:14px !important;
  border-radius:15px !important;
}
.kpi-compact-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  min-height:28px;
}
.kpi-compact-head .kpi-caption{
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:#718594;
}
.kpi-compact-head .kpi-key{
  font-size:18px;
  line-height:1;
  font-weight:900;
  color:#49dcff;
  margin-top:2px;
}
.kpi-compact-head .kpi-status{
  font-size:8px;
  color:#718594;
  white-space:nowrap;
}
.kpi-compact-grid{
  display:grid !important;
  grid-template-columns:repeat(5,minmax(0,1fr)) !important;
  gap:8px !important;
}
.kpi-compact-card{
  min-width:0;
  height:66px;
  padding:7px 9px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#176b85,#155c73);
  border:1px solid #237995;
  box-shadow:0 4px 12px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035);
}
.kpi-compact-card .flow-label{
  font-size:8px;
  line-height:1;
  margin-bottom:5px;
  letter-spacing:.2px;
}
.kpi-compact-card .flow-value{
  font-size:21px;
  line-height:1;
  letter-spacing:-.4px;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.kpi-compact-formula{
  margin-top:7px !important;
  font-size:8px !important;
  line-height:1.1;
}
.kpi-concentrated{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  gap:8px !important;
}
.kpi-jde{background:linear-gradient(145deg,#123f36,#12332f) !important;border-color:#2b9b7a !important;}
.kpi-jde .flow-label{color:#8ee8c8 !important;}
.kpi-jde .flow-value{color:#43df82 !important;}
.jde-check{display:inline-block;margin-left:10px;color:#7f95a2;font-weight:800;}
.jde-check.good{color:#43df82;}
.jde-check.warn{color:#ffd15c;}
@media(max-width:1400px){.kpi-concentrated{grid-template-columns:repeat(4,minmax(0,1fr)) !important;}}
@media(max-width:900px){.kpi-concentrated{grid-template-columns:repeat(3,minmax(0,1fr)) !important;}}
@media(max-width:600px){.kpi-concentrated{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}}
@media(max-width:900px){
  .kpi-compact-grid{grid-template-columns:repeat(3,minmax(0,1fr)) !important;}
}
@media(max-width:600px){
  .kpi-compact{padding:10px !important;}
  .kpi-compact-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .kpi-compact-card{height:64px;}
  .kpi-compact-card .flow-value{font-size:19px;}
}


/* ===== KPI PRO · MÁS LEGIBLE Y PREMIUM ===== */
.kpi-compact{
  padding:13px 14px 10px !important;
  border-radius:16px !important;
  background:
    radial-gradient(circle at 50% -80%,rgba(32,157,202,.10),transparent 55%),
    linear-gradient(180deg,#111b24,#0b1218) !important;
  border-color:#263b49 !important;
}
.kpi-compact-head{
  margin-bottom:9px !important;
}
.kpi-compact-head .kpi-caption{
  font-size:9px !important;
  font-weight:800;
  letter-spacing:1.1px !important;
  color:#9bb0bd !important;
}
.kpi-compact-head .kpi-key{
  font-size:20px !important;
  font-weight:950 !important;
  letter-spacing:.15px;
  color:#4ddcff !important;
  text-shadow:0 0 14px rgba(77,220,255,.16);
}
.kpi-compact-head .kpi-status{
  font-size:9px !important;
  color:#8da3b1 !important;
}

/* tarjetas individuales */
.kpi-compact-card{
  height:72px !important;
  padding:8px 10px !important;
  border-radius:13px !important;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(35,128,158,.98),rgba(22,91,116,.98)) !important;
  border:1px solid rgba(70,190,224,.42) !important;
  box-shadow:
    0 7px 18px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.18) !important;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.kpi-compact-card::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:2px;
  background:linear-gradient(90deg,transparent,#55ddff,transparent);
  opacity:.8;
}
.kpi-compact-card:hover{
  transform:translateY(-1px);
  border-color:rgba(90,211,241,.72) !important;
  box-shadow:
    0 10px 24px rgba(0,0,0,.34),
    0 0 18px rgba(40,180,220,.08),
    inset 0 1px 0 rgba(255,255,255,.12) !important;
}
.kpi-compact-card .flow-label{
  color:#e9f8fc !important;
  font-size:9px !important;
  font-weight:900 !important;
  letter-spacing:.55px !important;
  margin-bottom:6px !important;
  text-shadow:0 1px 2px rgba(0,0,0,.25);
}
.kpi-compact-card .flow-value{
  color:#ffffff !important;
  font-size:23px !important;
  font-weight:950 !important;
  letter-spacing:-.35px !important;
  text-shadow:0 1px 3px rgba(0,0,0,.28);
}
.kpi-compact-formula{
  color:#8da5b3 !important;
  font-size:8px !important;
  margin-top:7px !important;
  letter-spacing:.05px;
}
.kpi-compact-formula .text-slate-300{
  color:#b9cbd5 !important;
  font-weight:600;
}

@media(max-width:900px){
  .kpi-compact-card{height:70px !important;}
}
@media(max-width:600px){
  .kpi-compact-card{height:68px !important;}
  .kpi-compact-card .flow-value{font-size:20px !important;}
}


/* ===== FLUJO DE INVENTARIO · PRO ===== */
.flow-panel{
  position:relative;
  overflow:hidden;
  padding:16px !important;
  border-radius:18px !important;
  background:
    radial-gradient(circle at 35% 0%,rgba(35,167,207,.08),transparent 42%),
    linear-gradient(145deg,#101b24,#0a1117) !important;
  border:1px solid #263b49 !important;
  box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025);
}
.flow-panel::before{
  content:"";
  position:absolute;
  left:18px;right:18px;top:0;height:2px;
  background:linear-gradient(90deg,transparent,#37c7ed,transparent);
  opacity:.7;
}
.flow-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:8px;
}
.flow-title{
  font-size:16px !important;
  font-weight:950 !important;
  color:#eef7fa !important;
}
.flow-subtitle{
  margin-top:3px;
  font-size:10px !important;
  color:#78909f !important;
}
.flow-inventory-label{
  font-size:8px !important;
  letter-spacing:.9px;
  color:#78909f !important;
}
.flow-inventory{
  font-size:25px !important;
  line-height:1;
  font-weight:950 !important;
  color:#43df82 !important;
  text-shadow:0 0 18px rgba(67,223,130,.12);
}
.waterfall{
  height:330px !important;
  margin-top:2px;
  padding:4px 4px 0;
  border-radius:13px;
  background:linear-gradient(180deg,rgba(4,12,17,.28),rgba(4,10,14,.05));
}
.waterfall canvas{
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.12));
}

/* ===== RESUMEN PRO ===== */
.flow-summary{
  padding:16px !important;
  border-radius:18px !
